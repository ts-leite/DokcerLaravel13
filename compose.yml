
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: laravel_app
    working_dir: /var/www
    user: www-data
    volumes:
      - ./app:/var/www
    env_file:
      - ./app/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - laravel_network

  nginx:
    image: nginx:1.28-alpine
    container_name: laravel_nginx
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./app:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - laravel_network

  db:
    image: postgres:17-alpine
    container_name: laravel_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laravel}
      POSTGRES_USER: ${POSTGRES_USER:-laravel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - laravel_network

networks:
  laravel_network:
    name: laravel_network
    driver: bridge

volumes:
  postgres_data:
